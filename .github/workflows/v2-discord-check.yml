name: Verify Discord-connected Terravale V2 overlays

on:
  pull_request:
    paths:
      - "site-overrides/v2-**"
      - "site-overrides/approved-ads/**"
      - "site-overrides/approved-ads.json"
      - "tools/overlay-v239-with-discord.py"
      - "tools/v243_native_patch.py"
      - "tools/v245_theme_patch.py"
      - "tools/v246_native_patch.py"
      - "site-overrides/v246-real-characters.js"
      - "site-overrides/v246-ui-controls.js"
      - "site-overrides/v247-demo-party-admin.js"
      - "site-overrides/v247-theme-variants.js"
      - "site-overrides/v247-admin-and-themes.css"
      - "site-overrides/sql/v247_avatar_filename_fix.sql"
      - "site-overrides/sql/v247_demo_reset_and_delete.sql"
      - "site-overrides/sql/v248_aster_vaelith_demo_party.sql"
      - "site-overrides/v246-theme-creator-gallery.css"
      - "site-overrides/v245-theme-and-title.css"
      - "site-overrides/v243-campaign-achievement-bridge.js"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/v2-discord-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact approved V2 source, then add the hosted integration
        run: |
          python3 tools/assemble-approved-v239.py
          python3 tools/overlay-v239-with-discord.py
      - name: Verify browser scripts parse
        run: |
          node --check site-overrides/v2-discord-auth.mjs
          node --check site-overrides/v2-ads-atelier.mjs
          node --check site-overrides/v243-campaign-achievement-bridge.js
          node --check site-overrides/v246-real-characters.js
          node --check site-overrides/v246-ui-controls.js
          node --check site-overrides/v247-demo-party-admin.js
          node --check site-overrides/v247-theme-variants.js
      - name: Protect lore, theme, authentication and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          html=Path("published/veiled-codex/index.html").read_text()
          assert html.count('data-source="v2.css"')==1
          assert '--bg:#07080c' in html and '--accent:#c3a5ff' in html
          assert 'data-source="v2-discord-auth.mjs"' in html
          assert 'data-source="v2-ads-atelier.mjs"' in html
          assert 'data-source="v243-campaign-achievement-bridge.js"' in html
          assert 'Want to test <strong>Adblockn’t' not in html
          assert 'repeat(auto-fill,236px)' in html
          assert 'cabinet-grid' in html
          assert 'terravale_create_character' in html and 'v246-ui-controls.js' in html
          assert 'window.TERRAVALE_V225_FEATS' in html
          assert 'data-source="v247-demo-party-admin.js"' in html
          assert 'data-source="v247-theme-variants.js"' in html
          assert 'tv-demo-party-grid' in html and 'tv-crimson-variant' in html
          assert '118000' in html and 'RESET DEMO' in html
          assert 'Verdant Archive' in html and 'Crimson Court' in html and 'Bone Zone' in html
          assert 'cab-title-long' in html and 'tv-lore-title-long' in html
          assert 'body[data-theme="zero"] .tv-lore .lore-history' in html
          assert 'tv-personal-adblocker' in html
          assert 'Join a campaign first' in html
          assert 'Played by ' in html
          assert 'adblocknt_swarm_size' in html
          assert 'autocomplete="off" autocorrect="off"' in html
          assert 'id="tv-v2-ads-manifest"' in html
          assert 'data-source="v2-empty-workspace-integration"' in html
          assert "db.characters = []" in html and "db.campaigns = []" in html
          assert 'id="previewTray"' in html
          assert 'sb_secret_' not in html and 'service_role' not in html
          match=re.search(r'<script\s+type="application/json"\s+id="tv238-v14-content">([\s\S]*?)</script>',html)
          assert match
          data=json.loads(match.group(1))
          assert len(data["articles"])==283 and len(data["heritageArticles"])==36 and len(data["events"])==31
          assert all(a["title"]=="Restricted ancestry article" for a in data["heritageArticles"])
          assert len(list(Path("published/veiled-codex/ads").glob("*.webp")))==56
          print("PASS: real V2 skin and 319 placeholder-safe lore records untouched")
          print("PASS: 56 approved hosted ads, verified Discord module and no secret keys")
          PY
      - name: Upload public-safe V2 visual regression bundle
        uses: actions/upload-artifact@v4
        with:
          name: v245-verified-visual-review
          path: published/veiled-codex
          retention-days: 1
          if-no-files-found: error
