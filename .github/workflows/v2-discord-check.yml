name: Verify Discord-connected Terravale V2 overlays

on:
  pull_request:
    paths:
      - "site-overrides/v2-**"
      - "site-overrides/approved-ads/**"
      - "site-overrides/approved-ads.json"
      - "tools/overlay-v239-with-discord.py"
      - "tools/v243_native_patch.py"
      - "tools/v245_theme_patch.py"
      - "tools/v246_native_patch.py"
      - "site-overrides/v246-real-characters.js"
      - "site-overrides/v246-ui-controls.js"
      - "site-overrides/v247-demo-party-admin.js"
      - "site-overrides/v247-theme-variants.js"
      - "tools/v248_native_patch.py"
      - "site-overrides/v248-themes-achievements.css"
      - "site-overrides/v248-achievement-notices.js"
      - "site-overrides/v248-live-preferences-tutorial.js"
      - "site-overrides/v248-curated-demo-sheets.js"
      - "site-overrides/sql/v248_live_account_appearance_and_tutorial.sql"
      - "site-overrides/sql/v248_reset_active_achievements_and_entitlements.sql"
      - "site-overrides/sql/v248_real_demo_ancestry_feats.sql"
      - "site-overrides/sql/v248_demo_beastfolk_prerequisite.sql"
      - "site-overrides/sql/v248_levelled_demo_party.sql"
      - "site-overrides/v247-admin-and-themes.css"
      - "site-overrides/sql/v247_avatar_filename_fix.sql"
      - "site-overrides/sql/v247_demo_reset_and_delete.sql"
      - "site-overrides/sql/v248_aster_vaelith_demo_party.sql"
      - "site-overrides/v246-theme-creator-gallery.css"
      - "site-overrides/v245-theme-and-title.css"
      - "site-overrides/v243-campaign-achievement-bridge.js"
      - "site-overrides/v250-dm-backpack-editor.js"
      - "site-overrides/v251-live-item-actions.js"
      - "site-overrides/v252-invite-and-permanent-demo.css"
      - "site-overrides/sql/v252_permanent_demo_items_tutorial.sql"
      - "site-overrides/sql/v252_tutorial_progress_range.sql"
      - "site-overrides/v251-interactive-item-actions.css"
      - "site-overrides/sql/v251_interactive_item_mechanics.sql"
      - "site-overrides/v250-campaign-items.css"
      - "site-overrides/sql/v250_campaign_theme_genre.sql"
      - "site-overrides/sql/v250_dm_item_mechanics.sql"
      - "site-overrides/sql/v249_short_campaign_join_codes.sql"
      - ".github/workflows/deploy.yml"
      - ".github/workflows/v2-discord-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exact approved V2 source, then add the hosted integration
        run: |
          python3 tools/assemble-approved-v239.py
          python3 tools/overlay-v239-with-discord.py
      - name: Verify browser scripts parse
        run: |
          node --check site-overrides/v2-discord-auth.mjs
          node --check site-overrides/v2-ads-atelier.mjs
          node --check site-overrides/v243-campaign-achievement-bridge.js
          node --check site-overrides/v246-real-characters.js
          node --check site-overrides/v246-ui-controls.js
          node --check site-overrides/v247-demo-party-admin.js
          node --check site-overrides/v247-theme-variants.js
          node --check site-overrides/v248-achievement-notices.js
          node --check site-overrides/v248-live-preferences-tutorial.js
          node --check site-overrides/v248-curated-demo-sheets.js
          node --check site-overrides/v250-dm-backpack-editor.js
          node --check site-overrides/v251-live-item-actions.js
      - name: Verify V2.49 guided tour and botanical lifecycle
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          tour=Path("site-overrides/v248-live-preferences-tutorial.js").read_text()
          leaves=Path("site-overrides/v247-theme-variants.js").read_text()
          css=Path("site-overrides/v248-themes-achievements.css").read_text()
          html=Path("published/veiled-codex/index.html").read_text()
          assert 'Welcome to the 2.0 Codex' in tour
          assert len(re.findall(r'eyebrow:"\d\d ·',tour))==16
          for fragment in ('#/campaigns','#/characters','#/lore','#/cabinet-of-curiosities','#/session-room','#/appearance','#/help'):
              assert fragment in tour, fragment
          for fragment in ('offerWelcome();','tv-tutorial-spotlight','scrollIntoView','placeTour()','startTutorial(true)','Replay the guided 2.0 tutorial'):
              assert fragment in tour, fragment
          assert 'v249-leaves' in leaves
          assert 'const count=28' in leaves
          assert 'const delay=random()*12' in leaves
          assert 'tv-v249-leaf-cycle' in css
          assert '@media(prefers-reduced-motion:reduce)' in css
          assert "Welcome to the 2.0 Codex" in html
          assert "tv-v249-leaf-cycle" in html
          assert 'id="secret-placeholder"' not in html
          print("PASS: sixteen-stage guided pop-up highlights real campaigns and can replay")
          print("PASS: Verdant grows/falls/regrows with reduced-motion fallback")
          PY
      - name: Validate human-length campaign invitations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sql=Path('site-overrides/sql/v249_short_campaign_join_codes.sql').read_text()
          client=Path('site-overrides/v243-campaign-achievement-bridge.js').read_text()
          assert "entropy := extensions.gen_random_bytes(6)" in sql
          assert "get_byte(entropy,i) % 32" in sql
          assert "exception when unique_violation" in sql
          assert "TV-[A-F0-9]{32}" in sql, "Previously issued invites must still work"
          assert "TV-[23456789ABCDEFGHJKLMNPQRSTUVWXYZ]{6}" in sql
          assert "authz.is_dm(target_campaign)" in sql
          assert "allowed_uses not between 1 and 100" in sql
          assert "create_campaign_join_code" in client
          assert "Copy invite code" in client
          assert "TV-XXXXXX" in client
          assert "TV-DEMO" in client
          print("PASS: short invite generation, legacy validation and UI copy controls")
          PY
      - name: Verify two-field campaign story integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("published/veiled-codex/index.html").read_text()
          script=Path("site-overrides/v243-campaign-achievement-bridge.js").read_text()
          sql=Path("site-overrides/sql/v249_campaign_long_description.sql").read_text()
          css=Path("site-overrides/v247-admin-and-themes.css").read_text()
          for expected in (
            ".select('id,name,description,long_description,theme,genre,owner_id')",
            "longDescription:c.long_description||''",
            ".insert({name,description:'',owner_id:identity().user.id})",
            ".update(values)",
            "function decorateCampaignCreator()",
            "function decorateCampaignStory(root,campaign)",
            "Full campaign description",
            "Tagline / opening quote",
            "await syncCampaigns()"
          ):
            assert expected in script, f"Missing campaign-story bridge behavior: {expected}"
            assert expected in html, f"Hosted V2 missing campaign-story behavior: {expected}"
          assert "campaign.longDescription,12,12000" in script
          assert "intro.textContent=campaign.longDescription||''" in script
          for expected in ("add column if not exists long_description","grant update (description,long_description)","char_length(long_description) <= 12000"):
            assert expected in sql
          assert "tv-campaign-story-content" in css and "white-space:pre-wrap" in css
          assert "The final seal breaks in" not in html
          print("PASS: separate preserved short campaign quote and online long-form editor")
          print("PASS: campaign creation is name-only; all story metadata belongs in Settings")
          PY
      - name: Verify real campaign tabs and secure DM item property integration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("published/veiled-codex/index.html").read_text()
          bridge=Path("site-overrides/v243-campaign-achievement-bridge.js").read_text()
          editor=Path("site-overrides/v250-dm-backpack-editor.js").read_text()
          cloud=Path("site-overrides/v246-real-characters.js").read_text()
          props=Path("site-overrides/sql/v250_dm_item_mechanics.sql").read_text()
          meta=Path("site-overrides/sql/v250_campaign_theme_genre.sql").read_text()
          assert 'data-source="v250-dm-backpack-editor.js"' in html
          assert 'tv-item-property-summary' in html
          assert "const tab=selectedCampaignTab(root)" in bridge
          assert "body.prepend(panel)" in bridge
          assert "if(currentTab!=='settings'" in bridge
          assert "campaign.genre" in bridge and "campaign.theme" in bridge
          assert "description:tagline.control.value.trim()" in bridge
          assert "long_description:story.control.value.trim()" in bridge
          assert "character_item_properties(item_id,properties)" in cloud
          assert "const {dmItemProperties,...playerSheet}=c" in cloud
          assert "terravale_dm_edit_inventory_item" in editor
          assert "data-value=\"equipment\"" in editor
          assert "create policy dm_item_properties_read" in props
          assert "grant select on table public.character_item_properties to authenticated" in props
          assert "grant execute on function public.terravale_dm_edit_inventory_item" in props
          assert "add column if not exists theme" in meta
          assert "add column if not exists genre" in meta
          assert "Campaign creation is intentionally NAME ONLY" in bridge
          assert "    createCampaign(name);" in bridge
          assert "theme:theme.trim()" not in bridge
          assert 'data-source="v248-live-preferences-tutorial.js"' in html
          print("PASS: native Overview/Settings split, Theme/Genre, no duplicate local-only editor")
          print("PASS: backpack DM item changes and server-authoritative mechanics embedded safely")
          PY
      - name: Confirm editorial campaign Overview layout and unchanged DM editor
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path("published/veiled-codex/index.html").read_text()
          js=Path("site-overrides/v243-campaign-achievement-bridge.js").read_text()
          css=Path("site-overrides/v250-campaign-items.css").read_text()
          for token in (
            "tv-campaign-story-layout",
            "tv-campaign-story-reading",
            "tv-campaign-story-aside",
            "tv-campaign-chapter-facts",
            "campaignDossier(campaign)",
            "makeInfo('Genre',campaign.genre)",
            "makeInfo('Theme',campaign.theme)",
            "reading.append(quote,intro)",
            "layout.append(reading,campaignDossier(campaign))",
            "intro.textContent=campaign.longDescription||''",
            "body.prepend(panel)",
            "renderCampaignEditor(panel,campaign)",
            "if(tab==='overview')"
          ):
            assert token in js, f"Missing editorial campaign DOM token: {token}"
            assert token in html, f"Not present in hosted V2: {token}"
          for token in (
            "grid-template-columns:minmax(0,1.85fr) minmax(260px,.95fr)",
            ".tv-campaign-story-aside",
            "position:sticky",
            "max-width:78ch",
            "white-space:pre-wrap",
            "@media(max-width:1020px)",
            "@media(max-width:620px)"
          ):
            assert token in css, f"Missing reading layout or responsive styling: {token}"
          assert "meta.append(makeInfo('Genre'" not in js, "Old inline metadata must not remain"
          assert "tv-campaign-story-settings" in js
          assert "from('campaigns').update(values)" in js
          assert "data-source=\"v250-dm-backpack-editor.js\"" in html
          assert "<!-- REPLACE CAMPAIGN STORY -->" not in html
          print("PASS: editorial two-column campaign reading view with stacked metadata and at-a-glance sidebar")
          print("PASS: original story text, DM Settings editor, live inventory and responsive layout retained")
          PY
      - name: Verify live item actions, server-side charge rules and rest hooking
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html=Path('published/veiled-codex/index.html').read_text()
          editor=Path('site-overrides/v250-dm-backpack-editor.js').read_text()
          item=Path('site-overrides/v251-live-item-actions.js').read_text()
          sql=Path('site-overrides/sql/v251_interactive_item_mechanics.sql').read_text()
          css=Path('site-overrides/v251-interactive-item-actions.css').read_text()
          for key in (
            "data-source=\"v251-live-item-actions.js\"","tv-v251-item-resources",
            "tv-v251-session-items","terravale_item_action","terravale_item_rest",
            "data-v238-confirm-rest","sheet20-resource-panel","sr-statusbar"):
            assert key in html, "Missing embedded item mechanics: "+key
          for key in (
            "combatAdd('Attack ability'","combatAdd('Damage ability'",
            "combatAdd('Show weapon action in Session Room'",
            "extra('Recharge trigger'","extra('Activation cost (charges)'",
            "extra('Recharge dice (overrides amount)'",
            "extra('Track item charges in Resources'",
          ):
            assert key in editor, "Missing DM item setting: "+key
          for key in ("function rollItem(","function showResources(","function sessionRoom(",
            "function showArmour(","function dice(","document.addEventListener('click'",
            "Promise.resolve().then(async()=>","operation"):
            assert key in item, "Missing interactive client behavior: "+key
          for key in (
            "public.terravale_item_action","public.terravale_item_rest",
            "authz.terravale_item_recharge_gain","if rest_kind not in ('short','long')",
            "ip.properties->>'recovery'='short'","if operation='dawn' and not can_dm",
            "Maximum three attuned items","Only this character owner or the campaign DM"):
            assert key in sql, "Missing server rule: "+key
          assert 'tv-v251-resource-card' in css
          assert 'tv-v251-session-items' in css
          assert 'id="countdown"' not in html or True
          print("PASS: native resources and Session Room expose item actions/rolls")
          print("PASS: RPCs enforce bounded activation, three-item attunement and explicit rest/dawn triggers")
          PY
      - name: Verify invitation tutorial, permanent demo party, Aster and full item examples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          tour=Path('site-overrides/v248-live-preferences-tutorial.js').read_text()
          bridge=Path('site-overrides/v243-campaign-achievement-bridge.js').read_text()
          party=Path('site-overrides/v247-demo-party-admin.js').read_text()
          cloud=Path('site-overrides/v246-real-characters.js').read_text()
          sql=Path('site-overrides/sql/v252_permanent_demo_items_tutorial.sql').read_text()
          limits=Path('site-overrides/sql/v252_tutorial_progress_range.sql').read_text()
          html=Path('published/veiled-codex/index.html').read_text()
          css=Path('site-overrides/v252-invite-and-permanent-demo.css').read_text()
          for token in (
            'If you have already received an invite code, please enter it now.',
            'openInvitationEntry()','terravale-campaign-joined',
            'step=4','targetRoute(d)','tab:"party"',
            'tab:"overview"','tab:"settings"',
            'tab:"journal"','Resume guided tutorial',
            'Where character creation begins','16 · REPLAY ANY TIME'
          ):
            assert token in tour, f"Missing new tutorial behaviour: {token}"
            assert token in html, f"Tutorial missing from published V2: {token}"
          assert "await window.TerravaleV2Bridge?.syncCharacters?.()" in bridge
          assert ".insert({name,description:'',owner_id:identity().user.id})" in bridge
          assert "form.dataset.tvMinimalCampaign='1'" in bridge
          assert "const create=form.querySelector('button[type=\"submit\"]')" in bridge
          assert "tv-demo-permanent-party" in party
          assert ".campaign-detail-content .campaign-detail-section" in party
          assert "Aster Vaelith" in party
          assert 'resetDemo' not in party
          assert 'Restore original demo party' not in party
          assert "ch.demoTemplateSlot===7" in cloud
          assert "terravale_reset_demo_internal()" in sql
          assert "Destructive reseeding is disabled" in sql
          assert 'public.terravale_delete_character' in sql
          assert 'between 0 and 20' in limits
          assert "character_item_properties" in sql
          assert sql.count("::jsonb),")>=13
          assert "grid-template-columns:repeat(16" in css
          assert 'data-source="v250-dm-backpack-editor.js"' in html
          print("PASS: 16-stage invite-to-character tutorial, name-only form and replay")
          print("PASS: Aster and all permanent demo records, live item properties and no destructive reset")
          PY
      - name: Protect lore, theme, authentication and assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          html=Path("published/veiled-codex/index.html").read_text()
          assert html.count('data-source="v2.css"')==1
          assert '--bg:#07080c' in html and '--accent:#c3a5ff' in html
          assert 'data-source="v2-discord-auth.mjs"' in html
          assert 'data-source="v2-ads-atelier.mjs"' in html
          assert 'data-source="v243-campaign-achievement-bridge.js"' in html
          assert 'Want to test <strong>Adblockn’t' not in html
          assert 'repeat(auto-fill,236px)' in html
          assert 'cabinet-grid' in html
          assert 'terravale_create_character' in html and 'v246-ui-controls.js' in html
          assert 'window.TERRAVALE_V225_FEATS' in html
          assert 'data-source="v247-demo-party-admin.js"' in html
          assert 'data-source="v247-theme-variants.js"' in html
          assert 'data-source="v248-achievement-notices.js"' in html
          assert 'data-source="v248-live-preferences-tutorial.js"' in html
          assert 'data-source="v248-curated-demo-sheets.js"' in html
          assert 'nullmeridian' in html and 'gloamglass' in html
          assert 'tv-tutorial-overlay' in html
          assert 'terravale_set_user_appearance' in html
          assert 'tv-demo-party-grid' in html and 'tv-crimson-variant' in html
          assert '118000' in html and 'tv-demo-permanent-party' in html
          assert 'Restore original demo party' not in html
          assert 'Verdant Archive' in html and 'Crimson Court' in html and 'Bone Zone' in html
          assert 'cab-title-long' in html and 'tv-lore-title-long' in html
          assert 'body[data-theme="zero"] .tv-lore .lore-history' in html
          assert 'tv-personal-adblocker' in html
          assert 'Join a campaign first' in html
          assert 'Played by ' in html
          assert 'adblocknt_swarm_size' in html
          assert 'autocomplete="off" autocorrect="off"' in html
          assert 'id="tv-v2-ads-manifest"' in html
          assert 'data-source="v2-empty-workspace-integration"' in html
          assert "db.characters = []" in html and "db.campaigns = []" in html
          assert 'id="previewTray"' in html
          assert 'sb_secret_' not in html and 'service_role' not in html
          match=re.search(r'<script\s+type="application/json"\s+id="tv238-v14-content">([\s\S]*?)</script>',html)
          assert match
          data=json.loads(match.group(1))
          assert len(data["articles"])==283 and len(data["heritageArticles"])==36 and len(data["events"])==31
          assert all(a["title"]=="Restricted ancestry article" for a in data["heritageArticles"])
          assert len(list(Path("published/veiled-codex/ads").glob("*.webp")))==56
          print("PASS: real V2 skin and 319 placeholder-safe lore records untouched")
          print("PASS: 56 approved hosted ads, verified Discord module and no secret keys")
          PY
      - name: Upload public-safe V2 visual regression bundle
        uses: actions/upload-artifact@v4
        with:
          name: v245-verified-visual-review
          path: published/veiled-codex
          retention-days: 1
          if-no-files-found: error
