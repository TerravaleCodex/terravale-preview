name: Inspect native rest and tutorial routes without publishing
on:
  pull_request:
    paths:
      - "tools/v253-inspect.py"
      - ".github/workflows/v253-inspect.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 tools/assemble-approved-v239.py
          python3 tools/overlay-v239-with-discord.py
          python3 tools/v253-inspect.py
