            exit 1
          fi
          if grep -q 'codex-shared-sidebar-frame' site/characters/sheet-workshop/index.html; then
            echo "::error::Sheet workshop has nested sidebar"
            exit 1
          fi
          grep -q 'html.live-embedded .sidebar' site/characters/sheet-live/index.html
          grep -q 'loadApprovedCharacter' site/characters/sheet-live/index.html
          node site-overrides/test-live-sheet-embedded.cjs
