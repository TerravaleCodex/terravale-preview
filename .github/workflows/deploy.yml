          if updated<10:
              raise SystemExit('Character export was not installed on all website routes')
          print('Portable character export installed on',updated,'routes')
          PY
          node site-overrides/test-character-export-v1.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Inspect compiled authentication client initialization
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          needles=['storageKey:"supabase.auth.token"','storageKey:"sb-', 'supabase.auth.token',
                   '"supabase.auth.token"', 'auth.getUser','createBrowserClient','persistSession:']
          hits=0
          for file in Path('site/_next/static').rglob('*.js'):
              txt=file.read_text(errors='ignore')
              for needle in needles:
                  loc=txt.find(needle)
                  if loc<0:continue
                  # Only compiled application code and anonymous client options.
                  fragment=txt[max(0,loc-200):loc+240]
                  fragment=re.sub(r'(eyJ[A-Za-z0-9_-]{80,})','<redacted>',fragment)
                  print('AUTH BUILT CLIENT',file.name,needle,repr(fragment))
                  hits+=1
                  if hits>=15:break
              if hits>=15:break
          PY
      - name: Diagnose dashboard navigation and authentication storage patterns
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          import re
          text=Path('site/index.html').read_text()
          p=text.find('data-tour-nav="/party"')
          print('MAIN NAV EXCERPT',text[max(0,p-900):p+900][:1800])
          print('MAIN NAV document width hints')
          for q in ('sidebar', 'Collapse menu','data-tour-nav="/party"'):
            print(q, text.count(q))
          jslist=list(Path('site/_next').rglob('*.js'))
          evidence={}
          patterns=[r'storageKey[:=][^,}\n]{0,110}',r'sb-[a-z0-9]{12,40}-auth-token',
                    r'terravale[^"\x27\\s]{0,55}auth[^"\x27\\s]{0,30}',r'auth\.getSession',
                    r'localStorage\.getItem\([^)]{1,100}\)',
                    r'createBrowserClient\(']
          for file in jslist:
            src=file.read_text(errors='ignore')
            for pat in patterns:
              matches=re.findall(pat,src,re.I)
              if matches:
                evidence.setdefault(pat,[]).extend(matches[:5])
          for key,values in evidence.items():
            print('AUTH CLUES',key,repr(list(dict.fromkeys(values))[:8]))
          PY
      - name: Use the main Codex sidebar on all standalone pages
        shell: bash
        run: |
          python3 site-overrides/unify-site-sidebar.py
          node site-overrides/test-shared-sidebar.cjs
          test -s site/shared-sidebar/index.html
          grep -q 'id="room-native-nav"' site/party/index.html
          if grep -q 'codex-shared-sidebar-frame' site/party/index.html; then
