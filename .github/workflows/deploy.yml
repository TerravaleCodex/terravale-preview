name: Publish Terravale 2.0 Holding Page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "site-overrides/awaiting-v2.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: terravale-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble exactly one public HTML file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          cp site-overrides/awaiting-v2.html published/index.html
          grep -q 'Awaiting <em>2.0</em> update' published/index.html
          ! grep -qi 'supabase.co' published/index.html
          test "$(find published -type f | wc -l)" -eq 1
          test "$(find published -type f -name '*.html' | wc -l)" -eq 1
          echo "Only published/index.html will be deployed."
      - name: Upload single-page site
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://terravalecodex.github.io/terravale-preview/
    steps:
      - name: Deploy the one-page artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify holding page and retired routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://terravalecodex.github.io/terravale-preview"
          for attempt in $(seq 1 12); do
            html="$(curl --fail --silent --show-error --location --max-time 15 \
              --header 'Cache-Control: no-cache' \
              "${base}/?verify=${GITHUB_SHA}-${attempt}" || true)"
            if grep -q 'Awaiting <em>2.0</em> update' <<< "$html"; then
              echo "PASS: 2.0 holding page is live."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Holding page did not appear."
              exit 1
            fi
            sleep 5
          done
          for path in "/404.html" "/party/" "/session-room/" "/session-room-v2/" "/characters/sheet-live/" "/bloodforger-tree-v2/" "/rules-recovery-mobile/" "/codex.json"; do
            status="$(curl --silent --show-error --location --max-time 15 \
              --output /dev/null --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache' \
              "${base}${path}?retired=${GITHUB_SHA}")"
            if [ "$status" != "404" ]; then
              echo "::error::Retired path ${path} returned HTTP ${status}, expected 404."
              exit 1
            fi
            echo "PASS: retired ${path}"
          done
