      - "site-overrides/approved-ads/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: terravale-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify original approved V2.39 and add secure hosted accounts
        run: |
          python3 tools/assemble-approved-v239.py
          python3 tools/overlay-v239-with-discord.py
          node --check site-overrides/v2-discord-auth.mjs
          node --check site-overrides/v2-ads-atelier.mjs
          node --check site-overrides/v243-campaign-achievement-bridge.js
          node --check site-overrides/v246-real-characters.js
          node --check site-overrides/v246-ui-controls.js
          node --check site-overrides/v247-demo-party-admin.js
          node --check site-overrides/v247-theme-variants.js
          node --check site-overrides/v248-achievement-notices.js
          node --check site-overrides/v248-live-preferences-tutorial.js
          node --check site-overrides/v248-curated-demo-sheets.js
          node --check site-overrides/v250-dm-backpack-editor.js
          node --check site-overrides/v251-live-item-actions.js
          node --check site-overrides/v253-backpack-gifts.js
          node --check site-overrides/v254-rules-registry.js
          node --check site-overrides/v254-dm-vault.js
          node --check site-overrides/v254-character-proficiencies-wallet.js
          node --check site-overrides/v255-creator-native-choices.js
          node --check site-overrides/v255-character-training.js
          node --check site-overrides/v255-native-wallet.js
          node --check site-overrides/v255-custom-feat-forge.js
          node --check site-overrides/v255-shell-role-version.js
          node --check site-overrides/v248-achievement-notices.js
          node --check site-overrides/v248-live-preferences-tutorial.js
          node --check site-overrides/v248-curated-demo-sheets.js
      - name: Check native feats really receive an active grant
        run: node tests/v258-native-feats.cjs
      - name: Assemble humorous technical difficulties page and hidden public-safe V2
        shell: bash
        run: |
          set -euo pipefail
          cp site-overrides/awaiting-v2.html published/index.html
          python3 - <<'PY'
          from pathlib import Path
          home = Path("published/index.html").read_text()
          checks = (
              'WE ARE EXPERIENCING',
              'SOME TECHNICAL DIFFICULTIES',
              'ERROR: ARCANE_CORE_UNRESPONSIVE',
              'id="repair"',
              'id="fluff-lead"',
              'id="fluff-punchline"',
              'id="incident-title"',
              'id="diag-value-3"',
              'const incidents = [',
              'showIncident(incidentIndex)',
              'function restoreDiscordCallback()',
              'overscroll-behavior:none',
          )
          for check in checks:
              assert check in home, f"Technical difficulties page missing required content: {check}"
          assert 'id="secret-placeholder"' not in home, "Secret button must be removed"
          assert 'secretV239Entrance' not in home, "Secret click handler must be removed"
          assert 'id="countdown-hours"' not in home, "Old countdown remains"
          assert '2026-11-07T21:30:00Z' not in home, "Old countdown deadline remains"
          assert "supabase.co" not in home.lower()
          redirect = '<script>if(location.pathname!=="/terravale-preview/"){location.replace("/terravale-preview/");}</script>'
          fallback = home.replace("</head>", redirect + "</head>", 1)
          assert redirect in fallback
          Path("published/404.html").write_text(fallback)
          public = Path("published/veiled-codex/index.html")
          assert public.stat().st_size > 7000000
          assert sorted(x.name for x in Path("published").iterdir()) == [
              "404.html", "index.html", "veiled-codex"
          ], "Unapproved files in GitHub Pages output"
          assert sorted(p.name for p in public.parent.iterdir()) == ["ads", "index.html"], "Unexpected published assets"
          assert len(list((public.parent / "ads").glob("zip-*.webp"))) == 56, "Approved ads missing"
          assert "data-source=\"v2-discord-auth.mjs\"" in public.read_text(), "Real hosted auth missing"
          assert "v243-campaign-achievement-bridge.js" in public.read_text(), "Cloud campaign bridge missing"
          for v248 in ("v248-achievement-notices.js","v248-live-preferences-tutorial.js","v248-curated-demo-sheets.js","v250-dm-backpack-editor.js","v251-live-item-actions.js","v253-backpack-gifts.js"):
              assert v248 in public.read_text(), f"Missing live V2.48 module: {v248}"
          print("PASS: randomized humorous fluff and incident logs, with no secret button; Discord callback preserved")
          print("PASS: only two root holding files plus one public-safe V2 preview")
          PY
      - name: Upload safe GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://terravalecodex.github.io/terravale-preview/
    steps:
      - name: Deploy technical difficulties page with approved V2 preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live technical difficulties page, V2 HTML and retired routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://terravalecodex.github.io/terravale-preview"
          for attempt in $(seq 1 12); do
            curl --fail --silent --show-error --location --max-time 15 \
              --header 'Cache-Control: no-cache' \
              "$base/?verify=$GITHUB_SHA-$attempt" > /tmp/terravale-home.html || true
            if grep -q 'WE ARE EXPERIENCING' /tmp/terravale-home.html &&
               grep -q 'SOME TECHNICAL DIFFICULTIES' /tmp/terravale-home.html &&
               grep -q 'id="repair"' /tmp/terravale-home.html &&
               grep -q 'id="fluff-lead"' /tmp/terravale-home.html &&
               grep -q 'id="incident-title"' /tmp/terravale-home.html &&
               grep -Fq 'const incidents = [' /tmp/terravale-home.html &&
               ! grep -q 'id="secret-placeholder"' /tmp/terravale-home.html &&
               ! grep -q 'id="countdown-hours"' /tmp/terravale-home.html; then
              echo "PASS: rotating glitch explanations and diagnostics are live, without secret entrance."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Rotating glitch maintenance page did not appear."
              exit 1
            fi
            sleep 5
          done

          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --output /tmp/terravale-v239-live.html --write-out '%{http_code}' \
              "$base/veiled-codex/?verify=$GITHUB_SHA-$attempt" || true)"
            if [ "$status" = 200 ] &&
               grep -q 'data-source="v2.css"' /tmp/terravale-v239-live.html &&
               grep -q 'window.TERRAVALE_V238={version:' /tmp/terravale-v239-live.html; then
              echo "PASS: actual V2.39 offline page is serving."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Genuine V2.39 hidden page missing (HTTP $status)."
              exit 1
            fi
            sleep 5
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          raw=Path("/tmp/terravale-v239-live.html").read_bytes()
          assert b'data-source="v2-discord-auth.mjs"' in raw, "Discord OAuth integration missing"
          assert b'data-source="v2-ads-atelier.mjs"' in raw, "In-site Atelier integration missing"
          assert b'data-source="v250-dm-backpack-editor.js"' in raw, "DM mechanics integration missing"
          assert b'data-source="v251-live-item-actions.js"' in raw, "Interactive item actions missing"
          assert b'data-source="v253-backpack-gifts.js"' in raw, "Backpack gifts missing"
          assert b'data-source="v254-rules-registry.js"' in raw, "V4 rules registry missing"
          assert b'data-source="v254-dm-vault.js"' in raw, "DM vault and treasury missing"
          assert b'data-source="v254-character-proficiencies-wallet.js"' in raw, "Creator wallet and proficiencies missing"
          assert b'data-source="v255-custom-feat-forge.js"' in raw, "V2.55 feat forge missing"
          assert b'data-source="v255-character-training.js"' in raw, "V2.55 languages missing"
          assert b'data-source="v255-native-wallet.js"' in raw, "V2.55 wallet missing"
          assert b'data-source="v255-creator-native-choices.js"' in raw, "V2.55 creator missing"
          assert b'window.addEventListener(\'click\',e=>{' in raw, "Pre-native item rest listener missing"
          assert b'If you have already received an invite code' in raw, "Invitation tutorial missing"
          assert b'tv-demo-permanent-party' in raw, "Permanent demo roster bridge missing"
          assert b'Campaign creation is intentionally NAME ONLY' in raw, "Simple campaign creation missing"
          assert b'--bg:#07080c' in raw, "Original V2 theme not present"
          assert b"sb_secret_" not in raw, "Private API key detected"
          html=raw.decode("utf-8")
          match=re.search(r'<script\s+type="application/json"\s+id="tv238-v14-content">([\s\S]*?)</script>',html)
          assert match, "Missing V14 content"
          data=json.loads(match.group(1))
          assert len(data["articles"])==283
          assert len(data["heritageArticles"])==36
          assert len(data["events"])==31
          assert all(a["title"]=="Restricted ancestry article" and
                     "does not contain the article text" in a["html"]
                     for a in data["heritageArticles"])
          print("PASS: verified approved V2.39 lore and theme with hosted OAuth overlay.")
          print("PASS: 283 public, 36 protected placeholders, 31 calendar events. All unchanged.")
          PY
          for path in "/404.html" "/party/" "/session-room/" "/session-room-v2/" "/characters/sheet-live/" "/bloodforger-tree-v2/" "/rules-recovery-mobile/" "/codex.json"; do
            status="$(curl --silent --show-error --location --max-time 15 \
              --output /tmp/terravale-retired.html --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache' \
              "$base$path?retired=$GITHUB_SHA")"
            expected_status=404
            if [ "$path" = "/404.html" ]; then expected_status=200; fi
            if [ "$status" != "$expected_status" ] ||
               ! grep -q 'SOME TECHNICAL DIFFICULTIES' /tmp/terravale-retired.html ||
               ! grep -q 'location.replace("/terravale-preview/")' /tmp/terravale-retired.html; then
              echo "::error::Retired root path $path did not show the fallback (HTTP $status)."
              exit 1
            fi
          done
          echo "PASS: retired root routes still return the holding page."
