    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "site-overrides/**"
      - "tools/**"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: terravale-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify original approved V2.39 and add secure hosted accounts
        run: |
          python3 tools/assemble-approved-v239.py
          python3 tools/overlay-v239-with-discord.py
          node --check site-overrides/v2-discord-auth.mjs
          node --check site-overrides/v2-ads-atelier.mjs
          node --check site-overrides/v243-campaign-achievement-bridge.js
          node --check site-overrides/v246-real-characters.js
          node --check site-overrides/v246-ui-controls.js
          node --check site-overrides/v247-demo-party-admin.js
          node --check site-overrides/v247-theme-variants.js
          node --check site-overrides/v248-achievement-notices.js
          node --check site-overrides/v248-live-preferences-tutorial.js
          node --check site-overrides/v248-curated-demo-sheets.js
          node --check site-overrides/v250-dm-backpack-editor.js
          node --check site-overrides/v251-live-item-actions.js
          node --check site-overrides/v253-backpack-gifts.js
          node --check site-overrides/v254-rules-registry.js
          node --check site-overrides/v254-dm-vault.js
          node --check site-overrides/v254-character-proficiencies-wallet.js
          node --check site-overrides/v255-creator-native-choices.js
          node --check site-overrides/v255-character-training.js
          node --check site-overrides/v255-native-wallet.js
          node --check site-overrides/v255-custom-feat-forge.js
          node --check site-overrides/v270-divine-workspace.js
          node --check site-overrides/v273-boon-archive-import.js
          node --check site-overrides/v275-source-vault.js
          node --check site-overrides/v276-ui-stability.js
          node --check site-overrides/v255-shell-role-version.js
          node --check site-overrides/v248-achievement-notices.js
          node --check site-overrides/v248-live-preferences-tutorial.js
          node --check site-overrides/v248-curated-demo-sheets.js
      - name: Check native feats really receive an active grant
        run: node tests/v258-native-feats.cjs
      - name: Verify currency wording and unchanged exchange values
        run: node tests/v260-currency-copy.cjs
      - name: Verify verified player bylines in character headers and ledger
        run: node tests/v261-owner-and-currency.cjs
      - name: Verify final curated demo party and read-only server/UI guards
        run: node tests/v262-demo-party.cjs
      - name: Verify server RPCs reject NULL-owner privilege bypasses
        run: node tests/v262-null-owner-security.cjs
      - name: Verify V2.63 collapsible backpack, click-to-inspect gear and shared wallet
        run: node tests/v263-compact-inventory.cjs
      - name: Verify Session Room Dice, Checks and Character Actions with parallax
        run: node tests/v264-room-actions.cjs
      - name: Verify V2.67 low-resolution texture rollback and preserved Session Room
        run: node tests/v267-visual-rollback.cjs
      - name: Verify V2.75 Divine Chronicle and hidden player boons
        run: node tests/v270-divine-integration.cjs
      - name: Verify reviewed ZIP/Markdown boon importer
        run: node tests/v273-boon-archive-import.cjs
      - name: Verify V2.75 complete private Archive 2 source custody
        run: node tests/v275-source-vault.cjs
      - name: Verify UI stability and route-scoped observers
        run: node tests/v276-ui-stability.cjs
      - name: Publish the dashboard entrance and retain verified V2 content
        shell: bash
        run: |
          set -euo pipefail
          cp site-overrides/launch-home.html published/index.html
          cp site-overrides/launch-home.html published/404.html
          python3 - <<'PY'
          from pathlib import Path
          entry=Path("published/index.html").read_text(encoding="utf-8")
          fallback=Path("published/404.html").read_text(encoding="utf-8")
          assert fallback==entry, "Retired routes should enter the same V2 dashboard"
          for marker in (
              "Terravale — The Living Codex",
              '<meta http-equiv="refresh"',
              'url=/terravale-preview/veiled-codex/',
              'window.location.replace(destination+window.location.search+(window.location.hash||"#/"))',
              '<a href="/terravale-preview/veiled-codex/">Enter Terravale</a>',
          ):
              assert marker in entry, f"Missing dashboard entry marker: {marker}"
          assert "SOME TECHNICAL DIFFICULTIES" not in entry
          assert "WE ARE EXPERIENCING" not in entry
          assert "supabase.co" not in entry.lower(), "OAuth secrets must not reside in root entrance"
          public=Path("published/veiled-codex/index.html")
          assert public.stat().st_size > 7000000
          assert sorted(x.name for x in Path("published").iterdir()) == [
              "404.html","index.html","veiled-codex"
          ], "Unexpected root files in published site"
          assert sorted(x.name for x in public.parent.iterdir()) == ["ads","index.html"]
          assert len(list((public.parent/"ads").glob("zip-*.webp")))==56
          html=public.read_text(encoding="utf-8")
          assert 'data-source="v2-discord-auth.mjs"' in html, "Discord OAuth integration missing"
          assert 'data-source="v246-real-characters.js"' in html, "Approved character bridge missing"
          assert 'data-source="v251-live-item-actions.js"' in html, "Live Session Room actions missing"
          assert 'data-source="v255-custom-feat-forge.js"' in html, "Custom feat forge missing"
          assert 'data-source="v254-dm-vault.js"' in html, "DM Chronicle missing"
          assert 'data-source="v270-divine-workspace.js"' in html
          assert 'data-source="v273-boon-archive-import.js"' in html, "Divine workspace missing"
          assert "Terravale Codex V2.76" in html, "Latest V2 implementation missing"
          assert "sb_secret_" not in html
          print("PASS: public root enters the complete V2 Dashboard without the holding page")
          print("PASS: OAuth callback query and native SPA route are both preserved")
          print("PASS: signed-in site and 283+36 lore access structure remain unchanged")
          PY
      - name: Verify the launched public entrance and OAuth forwarding
        run: node tests/v268-public-home.cjs
      - name: Verify actual native Dashboard default route
        run: node tests/v269-dashboard-default.cjs
      - name: Upload safe GitHub Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://terravalecodex.github.io/terravale-preview/
    steps:
      - name: Deploy Terravale V2 dashboard to the public entrance
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public dashboard entrance, Discord integration and legacy paths
        shell: bash
        run: |
          set -euo pipefail
          base="https://terravalecodex.github.io/terravale-preview"
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location --max-time 25 \
              --header 'Cache-Control: no-cache' \
              --output /tmp/terravale-home.html --write-out '%{http_code}' \
              "$base/?launch=$GITHUB_SHA-$attempt" || true)"
            if [ "$status" = "200" ] &&
               grep -q 'Terravale — The Living Codex' /tmp/terravale-home.html &&
               grep -Fq 'window.location.replace(destination+window.location.search+(window.location.hash||"#/"))' /tmp/terravale-home.html &&
               grep -q '/terravale-preview/veiled-codex/' /tmp/terravale-home.html &&
               ! grep -q 'SOME TECHNICAL DIFFICULTIES' /tmp/terravale-home.html; then
              echo "PASS: the public URL opens the V2 dashboard instead of maintenance."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Public V2 dashboard entry has not appeared (HTTP $status)."
              exit 1
            fi
            sleep 5
          done
          for attempt in $(seq 1 12); do
            status="$(curl --silent --show-error --location --max-time 30 \
              --header 'Cache-Control: no-cache' \
              --output /tmp/terravale-v2-live.html --write-out '%{http_code}' \
              "$base/veiled-codex/?launch=$GITHUB_SHA-$attempt" || true)"
            if [ "$status" = "200" ] &&
               grep -q 'data-source="v2.css"' /tmp/terravale-v2-live.html &&
               grep -q 'data-source="v2-discord-auth.mjs"' /tmp/terravale-v2-live.html &&
               grep -q 'data-source="v246-real-characters.js"' /tmp/terravale-v2-live.html &&
               grep -q 'Terravale Codex V2.76' /tmp/terravale-v2-live.html &&
               grep -q 'data-source="v270-divine-workspace.js"' /tmp/terravale-v2-live.html &&
               ! grep -Fq "history.replaceState(null,'','#/characters')" /tmp/terravale-v2-live.html; then
              echo "PASS: complete V2 dashboard and Discord-authenticated site are serving."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::The complete V2 client is not ready at the dashboard destination (HTTP $status)."
              exit 1
            fi
            sleep 5
          done
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          raw=Path("/tmp/terravale-v2-live.html").read_bytes()
          for marker in (
            b'data-source="v2-ads-atelier.mjs"',
            b'data-source="v250-dm-backpack-editor.js"',
            b'data-source="v251-live-item-actions.js"',
            b'data-source="v254-dm-vault.js"',
            b'data-source="v255-custom-feat-forge.js"',
            b'data-source="v255-native-wallet.js"',
            b'tv-demo-permanent-party'
          ):
            assert marker in raw, f"V2 launch lacks required capability {marker}"
          assert b"sb_secret_" not in raw, "Private API key detected"
          html=raw.decode("utf-8")
          match=re.search(r'<script\s+type="application/json"\s+id="tv238-v14-content">([\s\S]*?)</script>',html)
          assert match, "Missing Lore Codex V14 payload"
          data=json.loads(match.group(1))
          assert len(data["articles"])==283, "Public lore count changed"
          assert len(data["heritageArticles"])==36, "Private ancestry placeholders changed"
          assert len(data["events"])==31, "Calendar changed"
          assert all(a["title"]=="Restricted ancestry article" and
                     "does not contain the article text" in a["html"]
                     for a in data["heritageArticles"]), "Restricted lore leaked in public payload"
          print("PASS: lore access restrictions, achievements, DM Chronicle and item systems preserved.")
          PY
          for path in "/404.html" "/party/" "/session-room/" "/session-room-v2/" "/characters/sheet-live/" "/bloodforger-tree-v2/" "/rules-recovery-mobile/" "/codex.json"; do
            status="$(curl --silent --show-error --location --max-time 15 \
              --output /tmp/terravale-fallback.html --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache' \
              "$base$path?launch=$GITHUB_SHA" || true)"
            expected_status=404
            if [ "$path" = "/404.html" ]; then expected_status=200; fi
            if [ "$status" != "$expected_status" ] ||
               ! grep -q 'Terravale — The Living Codex' /tmp/terravale-fallback.html ||
               ! grep -Fq 'window.location.replace(destination+window.location.search+(window.location.hash||"#/"))' /tmp/terravale-fallback.html; then
              echo "::error::Old root path $path did not offer the new V2 entrance (HTTP $status)."
              exit 1
            fi
          done
          echo "PASS: retired links safely lead players back to the V2 dashboard."
