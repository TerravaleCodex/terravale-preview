          cp site-overrides/character-export-v1.css site/character-export/character-export-v1.css
          node --check site/character-export/character-export-v1.js
          python3 - <<'PY'
          from pathlib import Path
          root=Path('site')
          script='<script defer src="/terravale-preview/character-export/character-export-v1.js"></script>'
          style='<link rel="stylesheet" href="/terravale-preview/character-export/character-export-v1.css">'
