  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://terravalecodex.github.io/terravale-preview/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Public smoke test — real Session Room replaces old route
        shell: bash
        run: |
          set -euo pipefail
          base="https://terravalecodex.github.io/terravale-preview"
          # Verify the public site, not only the generated GitHub Actions artifact.
                    # The common sidebar is generated from the homepage's own navigation.
          curl --fail --silent --show-error --location --max-time 15              "${base}/shared-sidebar/?verify=${GITHUB_SHA}" -o /tmp/terravale-shared-sidebar.html
          grep -q 'data-tour-nav="/party"' /tmp/terravale-shared-sidebar.html
          for route in "/party/" "/party" "/party.html" "/session-room/" "/session-room" "/session-room.html"; do
            passed=0
            for attempt in $(seq 1 18); do
              html=$(curl --fail --silent --show-error --location --max-time 15                 --header 'Cache-Control: no-cache'                 "${base}${route}?verify=${GITHUB_SHA}-${attempt}" || true)
              if grep -q 'data-room-production="1"' <<< "$html" &&
                 grep -q 'id="room-native-nav"' <<< "$html" &&
                 ! grep -q 'codex-shared-sidebar-frame' <<< "$html" &&
                 grep -q 'session-room-live.js' <<< "$html" &&
                 ! grep -q 'Campaign chat</h' <<< "$html"; then
                 passed=1
                 break
              fi
              sleep 5
            done
            if [[ "$passed" != "1" ]]; then
              echo "::error::Production Session Room is not being served at $route"
              exit 1
            fi
            echo "PASS public route $route serves new Session Room"
          done
          for sheet_route in "/characters/sheet-live/" "/characters/sheet-workshop/"; do
            found=0
            for attempt in $(seq 1 18); do
              sheet=$(curl --fail --silent --show-error --location --max-time 15 \
                "${base}${sheet_route}?verify=${GITHUB_SHA}-${attempt}" || true)
              if grep -q '<aside class="sidebar"' <<< "$sheet" &&
                 ! grep -q 'codex-shared-sidebar-frame' <<< "$sheet"; then
                found=1
                break
              fi
              sleep 5
            done
            if [[ "$found" != "1" ]]; then
              echo "::error::Broken embedded character sheet at $sheet_route"
              exit 1
            fi
            echo "PASS live embedded sheet route $sheet_route"
          done
          restored=$(curl --fail --silent --show-error --location --max-time 15 \
            "${base}/characters/sheet-render-fixed-20261101/?check=${GITHUB_SHA}")
          if grep -q 'codex-shared-sidebar-frame' <<< "$restored" ||
             ! grep -q 'html.live-embedded .sidebar' <<< "$restored"; then
            echo "::error::The restored embedded sheet URL is incorrect"
            exit 1
          fi
          echo "PASS restored approved character sheet route"
          # Navigation must appear in both Next pages and the cross-page shared sidebar.
          for nav_page in "/" "/shared-sidebar/"; do
            html=$(curl --fail --silent --show-error --location --max-time 15 \
              "${base}${nav_page}?check=${GITHUB_SHA}")
            if ! grep -q 'class="sidebar-nav"' <<< "$html" ||
               grep -q 'navigation-refresh.js?v=20261101-nav1' <<< "$html"; then
              echo "::error::Native navigation is missing or old overlay remains at ${nav_page}"
              exit 1
            fi
            echo "PASS server-rendered native sidebar at ${nav_page}"
          done
          curl --fail --silent --show-error --location --max-time 15 \
            "${base}/approved-sheet-iframe-bridge.js?check=${GITHUB_SHA}" -o /tmp/terravale-iframe-bridge.js
          grep -q 'sheet-render-fixed-20261101' /tmp/terravale-iframe-bridge.js
          echo "PASS published iframe compatibility bridge"
          for asset in "/session-room/session-room-live.js" "/session-room/session-room-live.css" "/session-room/room-nav-inline.js" "/session-room/room-nav-inline.css"; do
            curl --fail --silent --show-error --location --max-time 15               "${base}${asset}?verify=${GITHUB_SHA}" -o /dev/null
            echo "PASS public asset $asset"
          done
