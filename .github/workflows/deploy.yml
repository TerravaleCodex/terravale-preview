name: Publish Terravale Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: terravale-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract compiled preview
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import zipfile

          files = sorted(pathlib.Path(".preview-bundle").glob("part-*.b64"))
          if len(files) != 33:
              raise SystemExit("Missing one or more compiled-preview bundle parts")
          archive = base64.b64decode("".join(f.read_text().strip() for f in files), validate=True)
          expected = "435def572710089ddd6a59e84ec912d38ff5f20a268ae9740321b5919df04dbd"
          if hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit("Preview archive integrity verification failed")

          out = pathlib.Path("site")
          out.mkdir()
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              names = z.namelist()
              if len(names) != 579 or "index.html" not in names or "codex.json" not in names:
                  raise SystemExit("Compiled preview files incomplete")
              for item in z.infolist():
                  name = pathlib.PurePosixPath(item.filename)
                  if name.is_absolute() or ".." in name.parts or item.is_dir():
                      raise SystemExit("Unsafe path in compiled preview")
                  if ((item.external_attr >> 16) & 0o170000) == 0o120000:
                      raise SystemExit("Symlinks are not allowed in preview bundle")
              z.extractall(out)
          (out / ".nojekyll").touch()
          print("Prepared", len(names), "static files for GitHub Pages")
          PY
      - name: Validate appearance JavaScript
        run: node --check site-overrides/theme-collection.js
      - name: Apply public-safe appearance extension
        shell: bash
        run: |
          cp site-overrides/theme-collection.css site/theme-collection.css
          cp site-overrides/theme-collection.js site/theme-collection.js
          python3 - <<'PY'
          from pathlib import Path
          folder=Path("site")
          css='<link rel="stylesheet" href="/terravale-preview/theme-collection.css">'
          js='<script defer src="/terravale-preview/theme-collection.js"></script>'
          pages=0
          for file in folder.rglob("*.html"):
              text=file.read_text(encoding="utf-8")
              if "</head>" not in text or "</body>" not in text:
                  raise SystemExit(f"Invalid HTML for appearance extension: {file}")
              file.write_text(text.replace("</head>",css+"</head>",1).replace("</body>",js+"</body>",1),encoding="utf-8")
              pages+=1
          print(f"Applied shared appearance extension to {pages} static pages")
          PY
      - name: Publish optional character sheet workshop
        shell: bash
        run: |
          mkdir -p site/characters/sheet-workshop
          cp site-overrides/sheet-workshop-v0.9.1.html site/characters/sheet-workshop/index.html
          test -s site/characters/sheet-workshop/index.html
          grep -q 'Character Overview' site/characters/sheet-workshop/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://terravalecodex.github.io/terravale-preview/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
