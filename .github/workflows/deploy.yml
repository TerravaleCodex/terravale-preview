name: Publish Terravale Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write

concurrency:
  group: terravale-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and extract compiled preview
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import pathlib
          import zipfile

          files = sorted(pathlib.Path(".preview-bundle").glob("part-*.b64"))
          if len(files) != 34:
              raise SystemExit("Missing one or more compiled-preview bundle parts")
          archive = base64.b64decode("".join(f.read_text().strip() for f in files), validate=True)
          expected = "4b9d0ae726749570ed192f4c016e0b03d89a8ed845dc0451e0634314fe5267e5"
          if hashlib.sha256(archive).hexdigest() != expected:
              raise SystemExit("Preview archive integrity verification failed")

          out = pathlib.Path("site")
          out.mkdir()
          with zipfile.ZipFile(io.BytesIO(archive)) as z:
              names = z.namelist()
              if len(names) < 570 or "index.html" not in names or "codex.json" not in names:
                  raise SystemExit("Compiled preview files incomplete")
              for item in z.infolist():
                  name = pathlib.PurePosixPath(item.filename)
                  if name.is_absolute() or ".." in name.parts or item.is_dir():
                      raise SystemExit("Unsafe path in compiled preview")
                  if ((item.external_attr >> 16) & 0o170000) == 0o120000:
                      raise SystemExit("Symlinks are not allowed in preview bundle")
              z.extractall(out)
          (out / ".nojekyll").touch()
          print("Prepared", len(names), "static files for GitHub Pages")
          PY
      - name: Publish optional character sheet workshop
        shell: bash
        run: |
          mkdir -p site/characters/sheet-workshop
          cp site-overrides/sheet-workshop-v0.9.1.html site/characters/sheet-workshop/index.html
          test -s site/characters/sheet-workshop/index.html
          grep -q 'Character Overview' site/characters/sheet-workshop/index.html
      - name: Publish live character-sheet surface
        shell: bash
        run: |
          mkdir -p site/characters/sheet-live
          cp site-overrides/sheet-live-v091.html site/characters/sheet-live/index.html
          cp site-overrides/death-mechanics.js site/characters/sheet-live/death-mechanics.js
          cp site-overrides/class-feature-rules.json site/characters/sheet-live/class-feature-rules.json
          cp site-overrides/live-sheet-theme-fix.css site/characters/sheet-live/live-sheet-theme-fix.css
          grep -q 'loadApprovedCharacter' site/characters/sheet-live/index.html
          test -s site/characters/sheet-live/class-feature-rules.json
          test -s site/characters/sheet-live/death-mechanics.js
      - name: Apply unified theme to compiled character creator
        shell: bash
        run: |
          cp site-overrides/creator-theme-fix.css site/creator-theme-fix.css
          cp site-overrides/dm-editor-theme-fix.css site/dm-editor-theme-fix.css
          python3 - <<'PY'
          from pathlib import Path
          # The currently published website is a validated prebuilt archive.
          # Load theme corrections as a separate stylesheet rather than
          # replacing the archive and losing the current character-sheet UI.
          link='<link rel="stylesheet" href="/terravale-preview/creator-theme-fix.css"><link rel="stylesheet" href="/terravale-preview/dm-editor-theme-fix.css">'
          count=0
          for page in Path('site').rglob('*.html'):
              html=page.read_text()
              if '</head>' in html and link not in html:
                  page.write_text(html.replace('</head>',link+'</head>',1))
                  count+=1
          if count<10:
              raise SystemExit('Expected to inject theme styling into published Next pages')
          print('Theme styles linked on',count,'pages')
          PY
      - name: Verify class rule descriptions and equipment-slot protections
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          data=json.loads(Path('site/characters/sheet-live/class-feature-rules.json').read_text())
          sham=data['classes']['shaman']['descriptions']
          assert '7 days' in sham['Prepare the Dead']
          assert 'Presence' in sham['Ember']
          assert len(sham)>=30
          live=Path('site/characters/sheet-live/index.html').read_text()
          assert 'normalizedLiveItem' in live and 'jeans?' in live and 'future.length' in live
          assert 'Wallet · placeholder' in live and 'gear-slot-grid' in live
          assert 'syncPublishedSiteTheme' in live and 'live-sheet-theme-fix.css' in live
          embedded_theme=Path('site/characters/sheet-live/live-sheet-theme-fix.css').read_text()
          assert "data-codex-theme='shady'" in embedded_theme and "data-codex-theme='night-sky'" in embedded_theme
          theme=Path('site/creator-theme-fix.css').read_text()
          assert '.creator-choice.selected' in theme and '.creator-step.current' in theme
          dmtheme=Path('site/dm-editor-theme-fix.css').read_text()
          assert '.dm-roster-choice.selected' in dmtheme and '.dm-dashboard-navitem.active' in dmtheme
          assert '.advancement-workspace .choice-tile' in dmtheme
          assert 'function hpColor(current,maximum)' in live and 'background:${hpColor(hp(),p().hp)}' in live
          print('PASS: Shaman rules, HP colours, equipment and DM/creator themes')
          PY
      - name: Publish isolated Session Room V2 workshop
        shell: bash
        run: |
          mkdir -p site/session-room-v2
          cp site-overrides/session-room-v2.html site/session-room-v2/index.html
          cp site-overrides/session-room-v2-fidelity.css site/session-room-v2/session-room-v2-fidelity.css
          test -s site/session-room-v2/index.html
          grep -q 'Initiative Queue' site/session-room-v2/index.html
          grep -q 'Character Quick Checks' site/session-room-v2/index.html
          test -s site/session-room-v2/session-room-v2-fidelity.css
          grep -q 'sheet-tabs' site/session-room-v2/index.html
      - name: Check Session Room V2 preview JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib,re
          src=pathlib.Path('site/session-room-v2/index.html').read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',src,re.S)
          if len(scripts)!=1:
              raise SystemExit('Unexpected preview script count')
          pathlib.Path('/tmp/terravale-room-v2.js').write_text(scripts[0])
          PY
          node --check /tmp/terravale-room-v2.js
      - name: Test Shaman published class rules and level-appropriate feature cards
        shell: bash
        run: node site-overrides/test-shaman-rules.cjs
      - name: Test signed character portraits and URL renewal
        shell: bash
        run: node site-overrides/test-portrait-refresh.cjs
      - name: Test dynamic HP bar colours
        shell: bash
        run: node site-overrides/test-health-colors.cjs
      - name: Test death saves, rescue triggers and rapid damage
        shell: bash
        run: node site-overrides/test-death-mechanics.cjs
      - name: Check live sheet JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          import re,pathlib
          src=pathlib.Path('site/characters/sheet-live/index.html').read_text()
          matches=re.findall(r'<script[^>]*>(.*?)</script>',src,re.S)
          if not matches:
              raise SystemExit('Missing embedded sheet JavaScript')
          pathlib.Path('/tmp/terravale-live-sheet.js').write_text(matches[-1])
          PY
          node --check /tmp/terravale-live-sheet.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://terravalecodex.github.io/terravale-preview/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
