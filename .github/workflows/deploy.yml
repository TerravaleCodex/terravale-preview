          if pages<10:
              raise SystemExit('Cabinet V2 client navigation hook missing from site routes')
          print('Cabinet V2 navigation bridge installed on',pages,'pages')
          for name in ['cabinet-v2-live.html','cabinet-v2-live.js','cabinet-v2-embed.js']:
              if not (Path('site/codex-achievements')/name).is_file():
                  raise SystemExit('Missing Cabinet V2 asset: '+name)
          print('Cabinet V2 installed without replacing Codex sidebar')
          PY
          node site-overrides/test-cabinet-v2-live.cjs
      - name: Install portable character exports
        shell: bash
        run: |
          mkdir -p site/character-export
