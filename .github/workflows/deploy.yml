name: Publish Terravale 2.0 Holding Page

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "site-overrides/awaiting-v2.html"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: terravale-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble one visual page with a custom 404 fallback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p published
          cp site-overrides/awaiting-v2.html published/index.html
          python3 - <<'PY'
          from pathlib import Path
          import html
          home = Path('published/index.html').read_text()
          assert 'Awaiting <em>2.0</em> update' in home
          assert 'animation:sigil-spin' in home
          assert 'id="countdown-progress"' in home
          assert 'class="storm"' in home
          assert 'id="countdown-hours"' in home
          assert '2026-11-08T00:00:00Z' in home
          assert 'supabase.co' not in home.lower()
          # GitHub Pages requires a 404.html file to replace its generic error
          # on retired routes. It displays exactly the same holding design and
          # returns visitors to the canonical root URL automatically.
          redirect = '<script>if(location.pathname!=="/terravale-preview/"){location.replace("/terravale-preview/");}</script>'
          fallback = home.replace('</head>', redirect + '</head>', 1)
          assert redirect in fallback
          Path('published/404.html').write_text(fallback)
          files = sorted(p.name for p in Path('published').iterdir() if p.is_file())
          assert files == ['404.html', 'index.html'], files
          assert 'Awaiting <em>2.0</em> update' in fallback
          print('Publishing one visual page: index.html + matching GitHub Pages fallback.')
          PY
      - name: Upload single-page site
        uses: actions/upload-pages-artifact@v3
        with:
          path: published

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://terravalecodex.github.io/terravale-preview/
    steps:
      - name: Deploy the one-page artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify holding page and retired routes
        shell: bash
        run: |
          set -euo pipefail
          base="https://terravalecodex.github.io/terravale-preview"
          for attempt in $(seq 1 12); do
            html="$(curl --fail --silent --show-error --location --max-time 15 \
              --header 'Cache-Control: no-cache' \
              "${base}/?verify=${GITHUB_SHA}-${attempt}" || true)"
            if grep -q 'Awaiting <em>2.0</em> update' <<< "$html" &&
               grep -q 'id="countdown-hours"' <<< "$html" &&
               grep -q 'animation:sigil-spin' <<< "$html" &&
               grep -q 'id="countdown-progress"' <<< "$html" &&
               grep -q '2026-11-08T00:00:00Z' <<< "$html"; then
              echo "PASS: 2.0 holding page is live."
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "::error::Holding page did not appear."
              exit 1
            fi
            sleep 5
          done
          for path in "/404.html" "/party/" "/session-room/" "/session-room-v2/" "/characters/sheet-live/" "/bloodforger-tree-v2/" "/rules-recovery-mobile/" "/codex.json"; do
            response_file="/tmp/terravale-retired.html"
            status="$(curl --silent --show-error --location --max-time 15 \
              --output "$response_file" --write-out '%{http_code}' \
              --header 'Cache-Control: no-cache' \
              "${base}${path}?retired=${GITHUB_SHA}")"
            expected_status="404"
            if [ "$path" = "/404.html" ]; then
              expected_status="200"
            fi
            if [ "$status" != "$expected_status" ] ||
               ! grep -q 'Awaiting <em>2.0</em> update' "$response_file" ||
               ! grep -q 'location.replace("/terravale-preview/")' "$response_file"; then
              echo "::error::Retired path ${path} did not serve the branded fallback (HTTP ${status})."
              exit 1
            fi
            echo "PASS: ${path} displays branded 2.0 fallback and redirects to homepage"
          done
