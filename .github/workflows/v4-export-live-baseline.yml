name: V4 — Export exact live V2 baseline (never deploy)

on:
  push:
    branches:
      - v4/offline-live-baseline
    paths:
      - tools/export-v4-live-baseline.py
      - .github/workflows/v4-export-live-baseline.yml
      - .preview-v239-approved/**
      - tools/assemble-approved-v239.py
      - tools/overlay-v239-with-discord.py
      - site-overrides/**
      - tools/export-v4-offline-first-pass.py
      - v4/offline-database.js
      - tests/v4-offline-database.cjs
      - tests/test_v4_actual_live_parity.py
      - tools/v4_blank_content_patch.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assemble the original deployed V2.87 site without visual edits
        run: python tools/export-v4-live-baseline.py
      - name: Make V4 local first pass from actual live HTML (no recreation)
        run: python tools/export-v4-offline-first-pass.py
      - name: Verify exact live DOM and V2 module preservation
        run: python -m unittest discover -s tests -p 'test_v4_actual_live_parity.py' -v
      - name: Verify V2 offline database behaviour, ownership and backups
        run: node tests/v4-offline-database.cjs
      - name: Publish blank-content offline V4 only (no unredacted source)
        run: |
          python -c "import json; r=json.load(open('dist/V4_BLANK_CONTENT_REPORT.json')); assert r['redacted_collections'] and len(r['removed_demo_modules']) == 2"
      - name: Publish blank-content offline V4 artifact (never deploy)
        uses: actions/upload-artifact@v4
        with:
          name: V4-EMPTY-PLATFORM-LIVE-UI-OFFLINE-DB
          path: |
            dist/V4_Live_Layout_Offline_First_Pass.zip
            dist/V4_BLANK_CONTENT_REPORT.json
          if-no-files-found: error
          retention-days: 30
