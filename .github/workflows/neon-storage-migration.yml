name: Copy Terravale media to Neon staging (manual)

on:
  workflow_dispatch:
    inputs:
      execute:
        type: boolean
        default: false
        required: true
        description: "Copy to Neon staging and verify SHA-256 (false = dry run only)"

permissions:
  contents: read

concurrency:
  group: terravale-neon-staging-media-transfer
  cancel-in-progress: false

jobs:
  verified-copy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check migration safety logic without secrets
        run: python -m unittest discover -s tests -p 'test_neon_storage_migration.py' -v

      - name: Install pinned S3 SDK only for confirmed copy
        if: ${{ inputs.execute }}
        run: python -m pip install --disable-pip-version-check --no-input 'boto3==1.44.7'

      - name: Inventory private Supabase media (no writes)
        if: ${{ !inputs.execute }}
        env:
          TERRAVALE_SUPABASE_URL: https://emwlvbmnrrhxhrmlwkhs.supabase.co
          TERRAVALE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TERRAVALE_SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/neon_storage_migration.py

      - name: Copy and checksum-verify media on Neon staging
        if: ${{ inputs.execute }}
        env:
          TERRAVALE_SUPABASE_URL: https://emwlvbmnrrhxhrmlwkhs.supabase.co
          TERRAVALE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TERRAVALE_SUPABASE_SERVICE_ROLE_KEY }}
          TERRAVALE_NEON_S3_ENDPOINT: https://br-wandering-queen-bg2v6gjp.storage.c-9.eu-central-1.aws.neon.tech
          TERRAVALE_NEON_S3_REGION: eu-central-1
          TERRAVALE_NEON_S3_ACCESS_KEY_ID: ${{ secrets.TERRAVALE_NEON_S3_ACCESS_KEY_ID }}
          TERRAVALE_NEON_S3_SECRET_ACCESS_KEY: ${{ secrets.TERRAVALE_NEON_S3_SECRET_ACCESS_KEY }}
          CONFIRM_NEON_STORAGE_WRITE: "yes"
        run: python tools/neon_storage_migration.py --execute
